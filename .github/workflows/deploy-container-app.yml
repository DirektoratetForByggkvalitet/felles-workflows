name: Deploy Container App

# Reusable workflow. The app is deployed with the version tag. 'latest' is moved to the
# same image as a fallback for infrastructure jobs, and only the 5 newest version tags
# (plus the one just deployed) are kept.
#
# The caller must grant 'id-token: write' and pass the secrets below, e.g. with
# 'secrets: inherit'.

permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev, test or prod)
        required: true
        type: string
      image:
        description: Image name to deploy, e.g. ftpb-email-api
        required: true
        type: string
      version:
        description: Image tag to deploy, e.g. 2.0.42
        required: true
        type: string
      registry:
        description: Azure registry name
        required: true
        type: string
      resource-group:
        description: Target resource group
        required: true
        type: string
      container-app:
        description: Target container app
        required: true
        type: string
      auto-notify-slack:
        description: Automatically notify Slack. Set to false if deploying multiple apps from one repository.
        required: false
        type: boolean
        default: true
      override-branch-rules:
        description: Allow deploying prod from a branch other than main
        required: false
        type: boolean
        default: false
    secrets:
      ARM_CLIENT_ID:
        required: true
      ARM_TENANT_ID:
        required: true
      ARM_SUBSCRIPTION_ID:
        required: true
      ARKITEKTUM_SLACK_CICD_WEBHOOK_URL:
        required: false

concurrency:
  group: deploy-${{ inputs.container-app }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      REGISTRY: ${{ inputs.registry }}
      IMAGE_NAME: ${{ inputs.image }}
      IMAGE_REPO: ${{ inputs.registry }}.azurecr.io/${{ inputs.image }}
      VERSION: ${{ inputs.version }}
      CONTAINER_APP: ${{ inputs.container-app }}
      RESOURCE_GROUP: ${{ inputs.resource-group }}
    steps:
      - name: Only deploy prod from main
        if: ${{ inputs.environment == 'prod' && github.ref_name != 'main' && !inputs.override-branch-rules }}
        run: |
          echo "::error::prod can only be deployed from main (got $GITHUB_REF_NAME)"
          exit 1

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Check image exists
        run: |
          az acr repository show --name "$REGISTRY" --image "$IMAGE_NAME:$VERSION" --output none

      - name: Deploy container app
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          IMAGE="$IMAGE_REPO:$VERSION"
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --output none
          echo "Deployed \`$IMAGE\` to \`$CONTAINER_APP\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag image as latest
        run: |
          az acr login --name "$REGISTRY"
          docker buildx imagetools create --tag "$IMAGE_REPO:latest" "$IMAGE_REPO:$VERSION"
          echo "Tagged \`$IMAGE_REPO:$VERSION\` as \`latest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack
        if: ${{ always() && inputs.auto-notify-slack }}
        uses: DirektoratetForByggKvalitet/actions-notify-slack@v2
        with:
          webhook-url: ${{ secrets.ARKITEKTUM_SLACK_CICD_WEBHOOK_URL }}
          version: ${{ inputs.version }}
          environment: ${{ inputs.environment }}

  cleanup:
    needs: [deploy]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      REGISTRY: ${{ inputs.registry }}
      REPOSITORY: ${{ inputs.image }}
      VERSION: ${{ inputs.version }}
      KEEP: 5
    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      # Keeps 'latest', the deployed $VERSION and the $KEEP newest other version tags. The
      # deployed tag is always kept, since the container app pulls the image by that tag.
      # Older images are deleted by digest, unless the digest is shared with a kept tag, in
      # which case only the tag goes.
      - name: Delete old image tags
        run: |
          tags=$(az acr repository show-tags --name "$REGISTRY" --repository "$REPOSITORY" \
            --detail --orderby time_desc --query "[].{name:name, digest:digest}" --output json)
          kept=$(jq --argjson keep "$KEEP" --arg version "$VERSION" \
            '[.[] | select(.name == "latest" or .name == $version)] + ([.[] | select(.name != "latest" and .name != $version)][:$keep])' <<< "$tags")
          old=$(jq --argjson keep "$KEEP" --arg version "$VERSION" \
            '[.[] | select(.name != "latest" and .name != $version)][$keep:]' <<< "$tags")
          kept_digests=$(jq '[.[].digest] | unique' <<< "$kept")

          jq -r --argjson kept "$kept_digests" '.[] | select(.digest as $d | $kept | index($d)) | .name' <<< "$old" |
          while read -r tag; do
            echo "Untagging $REPOSITORY:$tag (image still in use by a kept tag)"
            az acr repository untag --name "$REGISTRY" --image "$REPOSITORY:$tag"
          done

          jq -r --argjson kept "$kept_digests" '[.[] | select(.digest as $d | $kept | index($d) | not) | .digest] | unique | .[]' <<< "$old" |
          while read -r digest; do
            echo "Deleting $REPOSITORY@$digest"
            az acr repository delete --name "$REGISTRY" --image "$REPOSITORY@$digest" --yes --output none
          done

      - name: Notify Slack on failure
        if: ${{ failure() && inputs.auto-notify-slack }}
        uses: DirektoratetForByggKvalitet/actions-notify-slack/raw@v3
        with:
          webhook-url: ${{ secrets.ARKITEKTUM_SLACK_CICD_WEBHOOK_URL }}
          details: Old image cleanup failed, please check pipeline logs.
